          title: "Andri Rutschmann"
          subtitle: "I'm a computational social scientist working at the intersection of large language models and empirical social research. My recent work uses multi-agent LLM simulations to study public online discourse: for my M.Sc. thesis I extended the open-source OASIS framework to simulate political discussion among 180 persona-conditioned agents — and examined when such simulations are, and aren't, valid instruments for social science. More broadly, I'm interested in how AI systems shape discourse, work, and society, and in building the empirical and simulation methods needed to anticipate those effects."
